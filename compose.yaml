services:
  model:
    image: ghcr.io/ggml-org/llama.cpp:server@sha256:ce6b9639bea61c87e641d0f5622229c23400fb84dc4d91075240e8983d7c3b47
    command: ["-m", "/models/model.gguf", "--host", "0.0.0.0", "--port", "8081", "--alias", "sourcebook", "-c", "8192", "-t", "4", "-ngl", "0", "--parallel", "1", "--jinja", "--reasoning", "off", "--reasoning-budget", "0", "--chat-template-file", "/configs/qwen3-no-thinking.jinja"]
    volumes:
      - ./.models:/models:ro
      - ./configs:/configs:ro
    mem_limit: 6g
    cpus: 4
    restart: unless-stopped
    # No host port: inference is available only to services on the private Docker network.
  api:
    build: .
    environment:
      QA_MODEL_URL: http://model:8081/v1
      QA_EMBEDDING_PATH: /models/embedding
      QA_CACHE_DIR: /models
      QA_ALLOWED_ORIGINS: ${QA_ALLOWED_ORIGINS:-["http://127.0.0.1:8000","http://localhost:8000"]}
    volumes:
      - ./.models:/models:ro
    ports:
      - "127.0.0.1:8000:8000"
    mem_limit: 2g
    cpus: 2
    pids_limit: 100
    read_only: true
    tmpfs:
      - /tmp:size=128m
    security_opt:
      - no-new-privileges:true
    depends_on:
      - model
    restart: unless-stopped
